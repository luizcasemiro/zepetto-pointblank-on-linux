<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- O cliente Point Blank pede "Arial Bold" como familia; a fonte que ele
       distribui (Font/Arial Negrito.ttf) declara familia "Arial" estilo Negrito. -->
  <alias binding="strong">
    <family>Arial Bold</family>
    <prefer><family>Arial</family></prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arial</string></edit>
  </match>
</fontconfig>
